 const key=document.getElementById("examSelect").value;currentExam=examData[key]||[];
 timeLeft=examDurations[key]||75*60;updateTimer();
 shuffledQuestions=shuffle(currentExam).map(q=>({...q,shuffledOptions:shuffle(q.o.map((text,index)=>({text,originalIndex:index})))}));
 document.getElementById("result").style.display="none";document.getElementById("wrongReview").style.display="none";
 renderQuestions();updateCounters();startTimer();window.scrollTo({top:0,behavior:"smooth"});
}
function renderQuestions(){
 const area=document.getElementById("examArea"),submit=document.getElementById("submitBtn");
 if(!currentExam.length){area.innerHTML='<div class="exam-disabled"><h2>Exam প্রস্তুত হচ্ছে</h2><p>এই Exam-এর প্রশ্ন পাওয়া যায়নি।</p></div>';submit.style.display="none";return}
 submit.style.display="inline-block";let html="";
 shuffledQuestions.forEach((q,index)=>{
  html+=`<div class="question-card" id="question-${index}"><div class="question-number">প্রশ্ন ${index+1} / ${currentExam.length}</div><div class="topic">📚 ${q.topic||""} &nbsp; | &nbsp; 📄 ${q.page||""}</div>`;
  if(q.image)html+=`<div class="question-image"><img src="${q.image}" alt="Question Image"></div>`;
  if(q.passage)html+=`<div class="passage">${q.passage}</div>`;
  html+=`<div class="question">${q.q}</div><div class="options">`;
  q.shuffledOptions.forEach((opt,i)=>{html+=`<div class="option" id="option-${index}-${i}" onclick="selectAnswer(${index},${i})"><b>${String.fromCharCode(65+i)}.</b> ${opt.text}</div>`});
  html+=`</div><div class="feedback" id="feedback-${index}"></div></div>`;
 });
 area.innerHTML=html;
}
function selectAnswer(qi,oi){
 if(submitted||userAnswers[qi])return;
 const q=shuffledQuestions[qi],selected=q.shuffledOptions[oi],isCorrect=selected.originalIndex===q.a;
 userAnswers[qi]={selected:oi,correct:isCorrect};
 q.shuffledOptions.forEach((opt,i)=>{const el=document.getElementById(`option-${qi}-${i}`);el.classList.add("disabled");if(opt.originalIndex===q.a)el.classList.add("correct");if(i===oi&&!isCorrect)el.classList.add("wrong")});
 const fb=document.getElementById(`feedback-${qi}`);fb.textContent=isCorrect?"✅ সঠিক উত্তর!":"❌ ভুল উত্তর!";fb.style.color=isCorrect?"#2e7d32":"#c62828";updateCounters();
}
function updateCounters(){const total=currentExam.length,answered=Object.keys(userAnswers).length;document.getElementById("answeredCounter").textContent=`${answered} / ${total}`;document.getElementById("questionCounter").textContent=`${answered?Math.min(answered+1,total):1} / ${total}`}
function startTimer(){clearInterval(timerInterval);timerInterval=setInterval(()=>{timeLeft--;updateTimer();if(timeLeft<=0){clearInterval(timerInterval);alert("⏰ সময় শেষ হয়েছে। পরীক্ষা স্বয়ংক্রিয়ভাবে Submit হবে।");submitExam(true)}},1000)}
function updateTimer(){const h=Math.floor(timeLeft/3600),m=Math.floor((timeLeft%3600)/60),s=timeLeft%60;document.getElementById("timer").textContent=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function submitExam(autoSubmit=false){
 if(submitted)return;
 const total=currentExam.length;
 const answered=Object.keys(userAnswers).length;
 if(total===0)return;
 submitted=true;
 clearInterval(timerInterval);
 let correct=0;
 Object.values(userAnswers).forEach(a=>{if(a.correct)correct++});
 const wrong=answered-correct,unanswered=total-answered,percent=total?Math.round(correct/total*100):0;
 document.getElementById("score").textContent=`${correct} / ${total}`;document.getElementById("scorePercent").textContent=`${percent}%`;document.getElementById("correctCount").textContent=correct;document.getElementById("wrongCount").textContent=wrong;document.getElementById("unansweredCount").textContent=unanswered;
 document.getElementById("result").style.display="block";document.getElementById("submitBtn").style.display="none";document.querySelectorAll(".option").forEach(el=>el.classList.add("disabled"));document.getElementById("result").scrollIntoView({behavior:"smooth"});
}
function showWrongReview(){
 const review=document.getElementById("wrongReview");if(review.style.display==="block"){review.style.display="none";return}
 let html="<h2>🔍 Wrong Answer Review</h2>",found=false;
 shuffledQuestions.forEach((q,i)=>{const a=userAnswers[i];if(!a||!a.correct){found=true;const co=q.shuffledOptions.find(o=>o.originalIndex===q.a);html+=`<div class="review-item"><b>প্রশ্ন ${i+1}</b><p>${q.q}</p><small>📄 ${q.page||""}</small>${a?`<p style="color:#c62828">❌ আপনার উত্তর: ${q.shuffledOptions[a.selected].text}</p>`:"<p>⚪ উত্তর দেওয়া হয়নি</p>"}<p style="color:#2e7d32">✅ সঠিক উত্তর: ${co.text}</p></div>`}});
 if(!found)html+='<div class="review-item">🎉 অসাধারণ! কোনো ভুল উত্তর নেই।</div>';
 review.innerHTML=html;review.style.display="block";review.scrollIntoView({behavior:"smooth"});
}
function restartExam(){if(!confirm("আপনি কি Exam আবার শুরু করতে চান?\n\nপ্রশ্ন ও Options নতুন করে Shuffle হবে।"))return;startExam()}

document.getElementById("submitBtn").addEventListener("click",function(){
    submitExam(false);
});

startExam();
</script></body></html>
